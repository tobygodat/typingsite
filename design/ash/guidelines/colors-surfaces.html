<!-- @dsCard group="Colors" viewport="700x150" subtitle="Tonal ladder — depth via lightness steps, no borders" name="Surface ladder" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font:var(--type-body);-webkit-font-smoothing:antialiased}
  body{padding:20px 24px;box-sizing:border-box}
  .mono{font:var(--type-mono-xs);color:var(--text-secondary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 0;min-width:90px;display:flex;flex-direction:column;gap:8px}
  .chip{height:56px;border-radius:var(--radius-sm)}
  .lbl{font:var(--type-label)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--ash-surface-0);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">surface-0 canvas</div><div class="mono">#1C1B18</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-surface-1);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">surface-1 panel</div><div class="mono">#232220</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-surface-2);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">surface-2 card</div><div class="mono">#2B2A26</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-surface-3);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">surface-3 raised</div><div class="mono">#33322E</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-surface-4);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">surface-4 pressed</div><div class="mono">#3C3A35</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-scrim);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">scrim</div><div class="mono">#000 · 55%</div></div>
</div></body></html>
