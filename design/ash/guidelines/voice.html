<!-- @dsCard group="Brand" viewport="700x170" subtitle="Sentence case · plain · say what happens" name="Copy voice" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font:var(--type-body);-webkit-font-smoothing:antialiased}
  body{padding:20px 24px;box-sizing:border-box}
  .mono{font:var(--type-mono-xs);color:var(--text-secondary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 0;min-width:90px;display:flex;flex-direction:column;gap:8px}
  .chip{height:56px;border-radius:var(--radius-sm)}
  .lbl{font:var(--type-label)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div style="background:var(--surface-card);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:6px">
    <span style="font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--accent)">Do</span>
    <span style="font:var(--type-body)">Save changes</span>
    <span style="font:var(--type-body)">3 open issues</span>
    <span style="font:var(--type-body)">Deploy failed. Check the build log.</span>
  </div>
  <div style="background:var(--surface-card);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:6px">
    <span style="font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--danger)">Don't</span>
    <span style="font:var(--type-body);color:var(--text-secondary)">Save Changes ✨</span>
    <span style="font:var(--type-body);color:var(--text-secondary)">You've got 3 issues waiting!</span>
    <span style="font:var(--type-body);color:var(--text-secondary)">Oops! Something went wrong.</span>
  </div>
</div></body></html>
