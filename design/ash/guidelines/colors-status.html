<!-- @dsCard group="Colors" viewport="700x150" subtitle="Primary blue for actions; mint/amber/coral for status — full-opacity ink, 14% tints" name="Primary & status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font:var(--type-body);-webkit-font-smoothing:antialiased}
  body{padding:20px 24px;box-sizing:border-box}
  .mono{font:var(--type-mono-xs);color:var(--text-secondary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 0;min-width:90px;display:flex;flex-direction:column;gap:8px}
  .chip{height:56px;border-radius:var(--radius-sm)}
  .lbl{font:var(--type-label)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--ash-primary);"></div><div class="lbl">primary</div><div class="mono">#0075DE · white 4.7:1</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-primary-text);"></div><div class="lbl">primary-text</div><div class="mono">#4DA3F5 · links · 6.2:1</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-accent);"></div><div class="lbl">success / mint</div><div class="mono">#8FD18A · 8.6:1</div></div>
<div class="sw"><div class="chip" style="background:var(--success-soft);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">success-soft</div><div class="mono">14% tint</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-danger);"></div><div class="lbl">danger</div><div class="mono">#E8907C · 6.4:1</div></div>
<div class="sw"><div class="chip" style="background:var(--danger-soft);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">danger-soft</div><div class="mono">14% tint</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-warning);"></div><div class="lbl">warning</div><div class="mono">#E0B565 · 8.0:1</div></div>
<div class="sw"><div class="chip" style="background:var(--warning-soft);box-shadow:inset 0 0 0 1px var(--border-hairline)"></div><div class="lbl">warning-soft</div><div class="mono">14% tint</div></div>
</div></body></html>
