<!-- @dsCard group="Colors" viewport="700x150" subtitle="Text roles — contrast against surface-1" name="Text colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font:var(--type-body);-webkit-font-smoothing:antialiased}
  body{padding:20px 24px;box-sizing:border-box}
  .mono{font:var(--type-mono-xs);color:var(--text-secondary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 0;min-width:90px;display:flex;flex-direction:column;gap:8px}
  .chip{height:56px;border-radius:var(--radius-sm)}
  .lbl{font:var(--type-label)}
</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--ash-text);"></div><div class="lbl">text</div><div class="mono">#E8E5DF · 12.3:1</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-muted);"></div><div class="lbl">muted</div><div class="mono">#A39E96 · 5.8:1</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-faint);"></div><div class="lbl">faint</div><div class="mono">#6F6B65 · decorative</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-outline);"></div><div class="lbl">outline</div><div class="mono">#7D7972</div></div>
<div class="sw"><div class="chip" style="background:var(--ash-selection);"></div><div class="lbl">selection</div><div class="mono">#4A463F</div></div>
</div></body></html>
