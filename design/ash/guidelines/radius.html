<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-canvas);color:var(--text-primary);font:var(--type-body);-webkit-font-smoothing:antialiased}
  body{padding:20px 24px;box-sizing:border-box}
  .mono{font:var(--type-mono-xs);color:var(--text-secondary)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 0;min-width:90px;display:flex;flex-direction:column;gap:8px}
  .chip{height:56px;border-radius:var(--radius-sm)}
  .lbl{font:var(--type-label)}
</style></head><body><div style="display:flex;gap:20px;align-items:flex-end">
<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--surface-raised);border-radius:var(--radius-xs)"></div><span class="mono">xs · 4</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--surface-raised);border-radius:var(--radius-sm)"></div><span class="mono">sm · 6</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--surface-raised);border-radius:var(--radius-md)"></div><span class="mono">md · 8</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--surface-raised);border-radius:var(--radius-lg)"></div><span class="mono">lg · 12</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;background:var(--surface-raised);border-radius:var(--radius-full)"></div><span class="mono">full</span></div>
</div></body></html>
