name: CI

# Every job runs on GitHub's hosted runners (docs/adr/0018-ci-on-hosted-runners.md).
on:
  pull_request:
  push:
    branches: [master]
  # The other engines, on request: `gh workflow run ci.yml --ref <branch> -f browsers=compat`.
  # A manual run never deploys (the deploy job needs a push to master).
  workflow_dispatch:
    inputs:
      browsers:
        description: Engines for Browser e2e
        type: choice
        options: [compat, chromium, all]
        default: compat

permissions:
  contents: read

jobs:
  unit:
    name: Unit and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: true
    # Which browser tests every e2e job of this run runs (scripts/e2e-scope.mjs).
    outputs:
      e2e-scope: ${{ steps.scope.outputs.scope }}
      e2e-specs: ${{ steps.scope.outputs.specs }}
      e2e-summary: ${{ steps.scope.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's merge commit and both its parents, so the scope can diff it against the base.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: scope
        run: node scripts/e2e-scope.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # One build per run, without npm test's and npm run build's repeat typecheck. The unit tests read it,
      # and the e2e jobs and the deploy reuse it from this run instead of building their own.
      - run: npm run build:dist
      - run: npm run test:unit
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # dist/.serve-manifest.json lists what server.mjs and the deploy may serve.
          include-hidden-files: true
          if-no-files-found: error
          # A re-run of this job replaces its dist/ rather than failing on the name.
          overwrite: true
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://stilltype.tobygodat.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The dist/ the unit job built and tested at this commit.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"

  e2e:
    name: ${{ matrix.total == 1 && format('Browser compat ({0})', matrix.engine) || format('Browser e2e ({0} {1}/6)', matrix.engine, matrix.shard) }}
    # After the deploy, so on master it reports without delaying it.
    needs: [unit, deploy]
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One group per engine and shard: in a shared group the jobs would cancel each other.
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.engine }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.browsers == 'all' && '[
            {"engine": "chromium", "shard": 1, "total": 6},
            {"engine": "chromium", "shard": 2, "total": 6},
            {"engine": "chromium", "shard": 3, "total": 6},
            {"engine": "chromium", "shard": 4, "total": 6},
            {"engine": "chromium", "shard": 5, "total": 6},
            {"engine": "chromium", "shard": 6, "total": 6},
            {"engine": "firefox", "shard": 1, "total": 6},
            {"engine": "firefox", "shard": 2, "total": 6},
            {"engine": "firefox", "shard": 3, "total": 6},
            {"engine": "firefox", "shard": 4, "total": 6},
            {"engine": "firefox", "shard": 5, "total": 6},
            {"engine": "firefox", "shard": 6, "total": 6},
            {"engine": "webkit", "shard": 1, "total": 6},
            {"engine": "webkit", "shard": 2, "total": 6},
            {"engine": "webkit", "shard": 3, "total": 6},
            {"engine": "webkit", "shard": 4, "total": 6},
            {"engine": "webkit", "shard": 5, "total": 6},
            {"engine": "webkit", "shard": 6, "total": 6}
          ]' ||
            github.event_name == 'push' && '[
            {"engine": "chromium", "shard": 1, "total": 6},
            {"engine": "chromium", "shard": 2, "total": 6},
            {"engine": "chromium", "shard": 3, "total": 6},
            {"engine": "chromium", "shard": 4, "total": 6},
            {"engine": "chromium", "shard": 5, "total": 6},
            {"engine": "chromium", "shard": 6, "total": 6},
            {"engine": "firefox", "shard": 1, "total": 1},
            {"engine": "webkit", "shard": 1, "total": 1}
          ]' ||
            inputs.browsers == 'compat' && '[
            {"engine": "firefox", "shard": 1, "total": 1},
            {"engine": "webkit", "shard": 1, "total": 1}
          ]' || '[
            {"engine": "chromium", "shard": 1, "total": 6},
            {"engine": "chromium", "shard": 2, "total": 6},
            {"engine": "chromium", "shard": 3, "total": 6},
            {"engine": "chromium", "shard": 4, "total": 6},
            {"engine": "chromium", "shard": 5, "total": 6},
            {"engine": "chromium", "shard": 6, "total": 6}
          ]') }}
    env:
      E2E_SCOPE: ${{ needs.unit.outputs.e2e-scope }}
      # Only on a PR that changes nothing but e2e specs; otherwise every test runs.
      E2E_SPECS: ${{ needs.unit.outputs.e2e-scope == 'specs' && needs.unit.outputs.e2e-specs || '' }}
      E2E_BROWSERS: ${{ matrix.engine }}
      E2E_FULL: ${{ inputs.browsers == 'all' && '1' || '0' }}
      # Serve the unit job's dist/ instead of building one per job (playwright.config.js).
      E2E_PREBUILT: '1'
    steps:
      # A PR that changes no file the browser tests can see passes every e2e job here, and runs nothing else.
      - if: env.E2E_SCOPE == 'none'
        run: echo "$SUMMARY"
        env:
          SUMMARY: ${{ fromJSON(needs.unit.outputs.e2e-summary) }}
      - if: env.E2E_SCOPE != 'none'
        uses: actions/checkout@v4
      - if: env.E2E_SCOPE != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: env.E2E_SCOPE != 'none'
        run: npm ci --no-audit --no-fund
      - if: env.E2E_SCOPE != 'none'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: env.E2E_SCOPE != 'none'
        run: npx playwright install --with-deps ${{ matrix.engine }}
      # This job's share of the tests by recorded duration (scripts/e2e-durations.json), not Playwright's
      # equal counts in file order. It stops the job if the list could drop or repeat a test, and reports
      # tests=0 when a PR selects fewer tests than there are shards.
      - if: env.E2E_SCOPE != 'none'
        id: shard
        run: node scripts/e2e-shards.mjs ${{ matrix.shard }}/${{ matrix.total }} e2e-timings/shard-tests.txt
      # WebKit's timing specs fail at 3 workers on a 4-core runner and pass at 1 (docs/adr/0018-ci-on-hosted-runners.md).
      - if: env.E2E_SCOPE != 'none' && steps.shard.outputs.tests != '0'
        run: npx playwright test --test-list e2e-timings/shard-tests.txt${{ matrix.engine == 'webkit' && ' --workers=1' || '' }}
      # Per-test durations, whether the tests passed or not; scripts/e2e-shards.mjs --refresh reads them.
      - if: ${{ !cancelled() && env.E2E_SCOPE != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ matrix.engine }}-${{ matrix.total }}-${{ matrix.shard }}
          path: e2e-timings/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
