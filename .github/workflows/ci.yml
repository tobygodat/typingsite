name: CI

# Both jobs run on the self-hosted runner on tobygdesktop (~/actions-runner, see HANDOFF.md).
# Its .env sets its own npm cache and E2E_PORT, and each job checks out under the runner's _work.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and build checks
    # Never run a fork's code on the desktop.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, tobygdesktop]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, tobygdesktop]
    timeout-minutes: 10
    environment:
      name: production
      url: https://stilltype.tobygodat.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
