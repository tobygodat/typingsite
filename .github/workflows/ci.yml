name: CI

# Every job runs on GitHub's hosted runners (docs/adr/0018-ci-on-hosted-runners.md).
on:
  pull_request:
  push:
    branches: [master]
  # The other engines, on request: `gh workflow run ci.yml --ref <branch> -f browsers=compat`.
  # A manual run never deploys (the deploy job needs a push to master).
  workflow_dispatch:
    inputs:
      browsers:
        description: Engines for Browser e2e
        type: choice
        options: [compat, chromium, all]
        default: compat

permissions:
  contents: read

jobs:
  unit:
    name: Unit and build checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://stilltype.tobygodat.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"

  e2e:
    name: ${{ matrix.total == 1 && format('Browser compat ({0})', matrix.engine) || format('Browser e2e ({0} {1}/6)', matrix.engine, matrix.shard) }}
    # After the deploy, so on master it reports without delaying it.
    needs: [unit, deploy]
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One group per engine and shard: in a shared group the jobs would cancel each other.
    concurrency:
      group: e2e-${{ github.ref }}-${{ matrix.engine }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.browsers == 'all' && '[
            {"engine": "chromium", "shard": 1, "total": 6},
            {"engine": "chromium", "shard": 2, "total": 6},
            {"engine": "chromium", "shard": 3, "total": 6},
            {"engine": "chromium", "shard": 4, "total": 6},
            {"engine": "chromium", "shard": 5, "total": 6},
            {"engine": "chromium", "shard": 6, "total": 6},
            {"engine": "firefox", "shard": 1, "total": 6},
            {"engine": "firefox", "shard": 2, "total": 6},
            {"engine": "firefox", "shard": 3, "total": 6},
            {"engine": "firefox", "shard": 4, "total": 6},
            {"engine": "firefox", "shard": 5, "total": 6},
            {"engine": "firefox", "shard": 6, "total": 6},
            {"engine": "webkit", "shard": 1, "total": 6},
            {"engine": "webkit", "shard": 2, "total": 6},
            {"engine": "webkit", "shard": 3, "total": 6},
            {"engine": "webkit", "shard": 4, "total": 6},
            {"engine": "webkit", "shard": 5, "total": 6},
            {"engine": "webkit", "shard": 6, "total": 6}
          ]' ||
            github.event_name == 'push' && '[
            {"engine": "chromium", "shard": 1, "total": 6},
            {"engine": "chromium", "shard": 2, "total": 6},
            {"engine": "chromium", "shard": 3, "total": 6},
            {"engine": "chromium", "shard": 4, "total": 6},
            {"engine": "chromium", "shard": 5, "total": 6},
            {"engine": "chromium", "shard": 6, "total": 6},
            {"engine": "firefox", "shard": 1, "total": 1},
            {"engine": "webkit", "shard": 1, "total": 1}
          ]' ||
            inputs.browsers == 'compat' && '[
            {"engine": "firefox", "shard": 1, "total": 1},
            {"engine": "webkit", "shard": 1, "total": 1}
          ]' || '[
            {"engine": "chromium", "shard": 1, "total": 6},
            {"engine": "chromium", "shard": 2, "total": 6},
            {"engine": "chromium", "shard": 3, "total": 6},
            {"engine": "chromium", "shard": 4, "total": 6},
            {"engine": "chromium", "shard": 5, "total": 6},
            {"engine": "chromium", "shard": 6, "total": 6}
          ]') }}
    env:
      E2E_BROWSERS: ${{ matrix.engine }}
      E2E_FULL: ${{ inputs.browsers == 'all' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # WebKit's timing specs fail at 3 workers on a 4-core runner and pass at 1 (docs/adr/0018-ci-on-hosted-runners.md).
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}${{ matrix.engine == 'webkit' && ' --workers=1' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
