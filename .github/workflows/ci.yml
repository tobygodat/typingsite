name: CI

# Every job runs on GitHub's hosted runners (docs/adr/0018-ci-on-hosted-runners.md).
on:
  pull_request:
  push:
    branches: [master]
  # The other engines, on request: `gh workflow run ci.yml --ref <branch> -f browsers=compat`.
  # A manual run never deploys (the deploy job needs a push to master).
  workflow_dispatch:
    inputs:
      browsers:
        description: Engines for Browser e2e
        type: choice
        options: [compat, chromium, all]
        default: compat

permissions:
  contents: read

jobs:
  # Builds dist/ once per run, as soon as the packages are installed, so the e2e jobs need not wait for
  # lint, typecheck and the unit tests. The unit tests, the e2e jobs and the deploy all use this dist/.
  # A manual run reports its gated jobs under "(manual)" names, so it can never replace a PR or push run's
  # required checks in the master ruleset (docs/adr/0025-merge-gate-on-github.md).
  build:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Build (manual)' || 'Build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    # Which browser tests every e2e job of this run runs (scripts/e2e-scope.mjs).
    outputs:
      e2e-scope: ${{ steps.scope.outputs.scope }}
      e2e-specs: ${{ steps.scope.outputs.specs }}
      e2e-summary: ${{ steps.scope.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's merge commit and both its parents, so the scope can diff it against the base.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        run: node scripts/e2e-scope.mjs
      # Bun installs the packages and runs the build (docs/adr/0028-bun-runs-the-build.md). The scope step above,
      # the unit tests and Playwright still run on Node 24 (docs/adr/0023-bun.md).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Without bun run build's typecheck: the unit job runs it.
      - run: bun run build:dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # dist/.serve-manifest.json lists what server.mjs and the deploy may serve.
          include-hidden-files: true
          if-no-files-found: error
          # A re-run of this job replaces its dist/ rather than failing on the name.
          overwrite: true
          retention-days: 7

  unit:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Unit and build checks (manual)' || 'Unit and build checks' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: unit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # The unit tests read the build job's dist/, the one the e2e jobs and the deploy use.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: bun run test:unit

  # The database and Edge Functions on a local Supabase stack: every migration applied to a fresh database,
  # every SQL test in supabase/tests, and both functions type-checked and called through the gateway. It
  # never reaches the production project. A PR runs it only when it changes supabase/ or this workflow;
  # master and manual runs always do. It isn't one of the master ruleset's required checks.
  supabase:
    name: Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's merge commit and both its parents, so the scope can diff it against the base.
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "A $EVENT run checks everything."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif ! changed=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            echo "Can't list the PR's changes, so this run checks everything."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(supabase/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "The PR changes supabase/ or this workflow."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The PR changes nothing in supabase/ or this workflow, so there is nothing to check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      # The functions run on Deno, so Deno type-checks them, without the root package.json's packages.
      - if: steps.scope.outputs.run == 'true'
        env:
          DENO_NO_PACKAGE_JSON: "1"
        run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts
      - if: steps.scope.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      # Applies every migration in supabase/migrations to a fresh database, and fails on the first that
      # doesn't apply. Only the services the checks use start.
      - if: steps.scope.outputs.run == 'true'
        run: supabase start -x studio,imgproxy,storage-api,realtime,logflare,vector,mailpit,postgres-meta,supavisor
      - if: steps.scope.outputs.run == 'true'
        run: bash supabase/tests/run-sql.sh
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.scope.outputs.run == 'true'
        run: node supabase/tests/edge-functions.mjs
      - if: steps.scope.outputs.run == 'true'
        run: node supabase/tests/race-service.mjs
      - if: failure() && steps.scope.outputs.run == 'true'
        run: docker ps -a --format '{{.Names}}' | grep '^supabase_' | xargs -I{} sh -c 'echo "::group::{}"; docker logs --tail 200 {} 2>&1; echo "::endgroup::"'

  learner-eval:
    name: Learner eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: learner-eval-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR's merge commit and both its parents, so the scope can diff it against the base.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "A $EVENT run checks the learner."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/learner-eval-scope.mjs
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        run: |
          set -o pipefail
          status=0
          bun run evaluate:learner -- --rule 0019 --check --workers "$(nproc)" | tee check.txt || status=$?
          { echo '## Learner eval (ADR 0019 validation)'; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  deploy:
    name: Deploy to Cloudflare
    # Master never deploys a commit that failed lint, typecheck or the unit tests.
    needs: [build, unit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://stilltype.tobygodat.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The dist/ the build job built and the unit tests ran against at this commit.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          packageManager: bun

  # The same jobs twice: a PR or manual run starts them once dist/ is built, and master after the deploy.
  e2e:
    name: Browser
    needs: build
    if: github.event_name != 'push'
    uses: ./.github/workflows/e2e.yml
    with:
      scope: ${{ needs.build.outputs.e2e-scope }}
      specs: ${{ needs.build.outputs.e2e-specs }}
      summary: ${{ needs.build.outputs.e2e-summary }}
      browsers: ${{ inputs.browsers }}

  e2e-after-deploy:
    name: Browser after deploy
    # After the deploy, so on master it reports without delaying it, and whether or not the deploy passed.
    # Not when a newer push cancelled this run's unit job: that push's own run tests master again.
    needs: [build, unit, deploy]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' && needs.unit.result != 'cancelled' }}
    uses: ./.github/workflows/e2e.yml
    with:
      scope: ${{ needs.build.outputs.e2e-scope }}
      specs: ${{ needs.build.outputs.e2e-specs }}
      summary: ${{ needs.build.outputs.e2e-summary }}

  # The one browser check the master ruleset requires, so the ruleset stays the same whatever the shard
  # count (docs/adr/0024-shorter-browser-run.md). It passes only when the build, the unit job and this
  # event's browser jobs all succeeded. It always runs, so a failed or skipped dependency fails it.
  e2e-summary:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Browser e2e (manual)' || 'Browser e2e' }}
    needs: [build, unit, e2e, e2e-after-deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.e2e.result }}
          AFTER_DEPLOY: ${{ needs.e2e-after-deploy.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Build: $BUILD"
          echo "Unit and build checks: $UNIT"
          echo "Browser: $BROWSER"
          echo "Browser after deploy: $AFTER_DEPLOY"
          if [ "$EVENT" = push ]; then browser=$AFTER_DEPLOY; else browser=$BROWSER; fi
          [ "$BUILD" = success ] && [ "$UNIT" = success ] && [ "$browser" = success ]
