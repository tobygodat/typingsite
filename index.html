<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f1eb" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="description" content="Focused typing practice that finds weak patterns, drills them, and measures the change on fresh text.">
  <title>Stilltype — focused typing practice</title>
  <script>
    // Resolve the theme and fonts before first paint so there is no flash. Guests always follow the system. A
    // custom theme (src/custom-themes.js) sets its colours on :root over dark or light, by its background's luminance.
    try {
      const root = document.documentElement;
      const user = JSON.parse(localStorage.getItem('stilltype-session-v1'))?.user?.id;
      const preferences = user ? JSON.parse(localStorage.getItem('stilltype-profile-v2:' + user))?.preferences : null;
      const dark = ['dark', 'terminal', 'midnight', 'nord'];
      const light = ['light', 'paper', 'shadcn', 'soft', 'swiss', 'e-ink'];
      let customs = [];
      try { customs = JSON.parse(preferences.customThemes); } catch {}
      const custom = (id) => (Array.isArray(customs) ? customs.find((entry) => entry?.id === id && typeof entry.colors?.ground === 'string') : null);
      const modeOf = (id) => {
        if (dark.includes(id) || light.includes(id)) return dark.includes(id) ? 'dark' : 'light';
        const ground = custom(id)?.colors.ground;
        if (!ground) return null;
        const [r, g, b] = [1, 3, 5].map((at) => parseInt(ground.slice(at, at + 2), 16) / 255).map((s) => (s <= 0.04045 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4));
        return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179 ? 'light' : 'dark';
      };
      const system = matchMedia('(prefers-color-scheme: light)').matches
        ? (modeOf(preferences?.lightTheme) === 'light' ? preferences.lightTheme : 'light')
        : (modeOf(preferences?.darkTheme) === 'dark' ? preferences.darkTheme : 'dark');
      const theme = modeOf(preferences?.theme) ? preferences.theme : system;
      const entry = custom(theme);
      root.dataset.theme = entry ? modeOf(theme) : theme;
      if (entry) {
        for (const [name, value] of Object.entries(entry.colors)) if (/^[a-z0-9-]+$/.test(name) && /^#[0-9a-f]{6}$/i.test(value)) root.style.setProperty('--' + name, value);
        root.dataset.custom = '';
      }
      // The typing and app fonts too (src/fonts.js), so the passage never reflows from Literata.
      if (['literata', 'source-serif', 'inter', 'jetbrains-mono', 'ibm-plex-mono', 'roboto-mono', 'fira-code'].includes(preferences?.typingFont)) root.dataset.typingFont = preferences.typingFont;
      if (['literata', 'source-serif', 'inter'].includes(preferences?.appFont)) root.dataset.appFont = preferences.appFont;
    } catch {}
  </script>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body data-view="practice" data-session="practice" data-font-size="28" data-word-highlight="off" data-word-highlight-slide="false" data-tape="false" data-live-metrics="false" data-keyboard="false" data-focus-mode="false" data-ghost="off">
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
